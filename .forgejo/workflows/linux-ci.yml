name: Linux CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'linux/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.forgejo/workflows/linux-ci.yml'
      - '.github/actions/setup-nix/**'
  push:
    branches: [ main ]
    paths:
      - 'linux/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.forgejo/workflows/linux-ci.yml'
      - '.github/actions/setup-nix/**'

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_FLAGS: --extra-experimental-features nix-command --extra-experimental-features flakes

jobs:
  build-and-test:
    name: Build and Test (Rust)
    runs-on: [self-hosted, linux]
    # The first run pulls the Rust toolchain and GTK4 closures into the nix
    # store and compiles the gtk4-rs bindings from scratch.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      # Forgejo's PR comment endpoint is /issues/{index}/comments.
      issues: write
    defaults:
      run:
        working-directory: linux

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    # `..#` points nix at the root flake while the working directory is linux/.
    - name: Check formatting
      run: nix $NIX_FLAGS develop ..# --command cargo fmt --check

    - name: Clippy
      run: nix $NIX_FLAGS develop ..# --command cargo clippy --all-targets -- -D warnings

    - name: Test
      run: nix $NIX_FLAGS develop ..# --command cargo test

    - name: Build (release)
      run: nix $NIX_FLAGS develop ..# --command cargo build --release

    # `nix build .#static` builds with --no-default-features because GTK cannot
    # be statically linked. This is the cheap guard that a PR cannot break the
    # published release artifact before it is merged.
    - name: Build (no GUI — mirrors the static release build)
      run: nix $NIX_FLAGS develop ..# --command cargo build --release --no-default-features

    - name: Comment on PR with Linux build status
      # Fork PRs get no write token on Forgejo and can't comment. Separate
      # marker from pr-verification.yml's DMG comment so a mixed Swift + Rust
      # PR gets one comment per platform instead of one overwriting the other.
      # curl + jq from the `ci` devShell rather than a github-script action:
      # Forgejo's API user object has no `type: "Bot"` field, so match on the
      # marker instead.
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      env:
        FORGEJO_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ..#ci --command bash -euo pipefail {0}
      run: |
        MARKER='<!-- pr-build-comment-linux -->'
        SHA="${HEAD_SHA:0:7}"
        BODY=$(cat <<EOF2
        $MARKER
        ## Linux Build Verified

        \`cargo fmt --check\`, clippy, \`cargo test\`, and a release build all passed for \`$SHA\`.

        > Static x86_64 release binaries are published as \`linux-vX.Y.Z\` releases — bump \`version\` in \`linux/Cargo.toml\` to cut one. To build locally: \`nix build .#static\` at the repo root.
        EOF2
        )
        PAYLOAD=$(jq -n --arg b "$BODY" '{body: $b}')
        EXISTING=""
        PAGE=1
        while [ -z "$EXISTING" ]; do
          RESP=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
            "$API_URL/repos/$REPO/issues/$PR_NUMBER/comments?page=$PAGE&limit=50")
          [ "$(echo "$RESP" | jq 'length')" -eq 0 ] && break
          EXISTING=$(echo "$RESP" | jq -r --arg m "$MARKER" 'map(select(.body | contains($m))) | .[0].id // empty')
          PAGE=$((PAGE + 1))
        done
        if [ -n "$EXISTING" ]; then
          curl -fsS -X PATCH -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' -d "$PAYLOAD" \
            "$API_URL/repos/$REPO/issues/comments/$EXISTING" > /dev/null
        else
          curl -fsS -X POST -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' -d "$PAYLOAD" \
            "$API_URL/repos/$REPO/issues/$PR_NUMBER/comments" > /dev/null
        fi
