name: Release Verification

on:
  # `published` only. Forgejo fires workflow events for releases created or
  # edited through the API with the job token, so listening to `edited` would
  # make this workflow's own download-link PATCH re-run the whole build.
  #
  # The `release` run does no Mac work: dispatch-release-build validates the
  # release and dispatches this workflow on `main` with `tag=<tag>`. Only that
  # dispatched run (OIDC sub `repo:…:ref:refs/heads/main`) can assume the
  # ci-tempo-statusbar-release role — a release run's sub is per-tag
  # (`ref:refs/tags/<tag>`) and cannot be trusted exactly (aws-account
  # tier1/tempo-statusbar.tf). Its workflow file comes from `main`, so a
  # branch cannot change the release steps.
  release:
    types: [published]
  # Without `tag`: a build test of the dispatched ref, no upload.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload; must be dispatched on main
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  # dispatch-release-build calls the workflow dispatch API with the job token.
  actions: write

concurrency:
  group: release-verification-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-release-build:
    name: Dispatch Release Build
    # `on: release` has no tag filter, so a `linux-v*` release cut by
    # linux-release.yml would otherwise start a full macOS sign+notarize build
    # and derive a nonsense MARKETING_VERSION ("linux-0.1.0"). The two release
    # lines are deliberately separate. Load-bearing on Forgejo:
    # linux-release.yml creates its release through the API with the job
    # token, and Forgejo does fire `release: published` for that.
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'linux-v')
    runs-on: [container, linux]
    timeout-minutes: 15
    # `curl`/`jq` come from the repo's `ci` devShell — the runner baseline is
    # nix/git/docker only.
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#ci --command bash -euo pipefail {0}
    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    - name: Validate release name matches tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_NAME: ${{ github.event.release.name }}
      run: |
        if [ -z "$RELEASE_NAME" ]; then
          echo "❌ Release name is empty. Set the release title to match the tag (e.g. '$RELEASE_TAG')."
          exit 1
        fi
        if [ "$RELEASE_TAG" != "$RELEASE_NAME" ]; then
          echo "❌ Release name '$RELEASE_NAME' does not match tag '$RELEASE_TAG'."
          echo ""
          echo "This usually means an RC release was created with the title 'v1.2.3-RC1'"
          echo "but the tag was left at 'v1.2.3', producing an orphaned tag at the stable"
          echo "version. Either:"
          echo "  - delete this release and its tag '$RELEASE_TAG' in Forgejo (Releases → Delete, then Tags → Delete)"
          echo "    and recreate it with matching name and tag, OR"
          echo "  - edit the release to make name and tag identical."
          exit 1
        fi
        echo "✅ Release name and tag both equal '$RELEASE_TAG'"

    - name: Dispatch release build on main
      # The job token has write on every unit of a non-fork repo, so it may
      # call the dispatch API; the dispatch bypasses the event notifier, so
      # Forgejo's "no workflows triggered by the job token" rule does not
      # apply. If the dispatched run does not start, run this workflow by
      # hand on `main` with `tag=<tag>` (docs/ci-cd.md).
      env:
        FORGEJO_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        jq -n --arg tag "$RELEASE_TAG" \
          '{ref: "main", inputs: {tag: $tag}, return_run_info: true}' > dispatch.json
        RESPONSE=$(curl -fsS -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H 'Content-Type: application/json' \
          --data @dispatch.json \
          "$API_URL/repos/$REPO/actions/workflows/release-tag.yml/dispatches")
        rm -f dispatch.json
        RUN_NUMBER=$(jq -r '.run_number // empty' <<<"$RESPONSE")
        if [ -n "$RUN_NUMBER" ]; then
          echo "✅ Dispatched release build for $RELEASE_TAG: run #$RUN_NUMBER"
          echo "   $SERVER_URL/$REPO/actions/runs/$RUN_NUMBER"
        else
          echo "✅ Dispatched release build for $RELEASE_TAG (no run info returned)"
          echo "   $SERVER_URL/$REPO/actions"
        fi

  release-build:
    name: Release Build
    runs-on: [host, macos, tempo]
    # Runs only on workflow_dispatch: dispatched on `main` with `tag` by
    # dispatch-release-build (signs, notarizes and uploads), or by hand
    # without `tag` as a build test with no upload. A `linux-v*` tag never
    # starts a Mac build.
    if: github.event_name == 'workflow_dispatch' && !startsWith(inputs.tag, 'linux-v')
    # Only two Macs serve three repos — a wedged job must not hold one for hours.
    timeout-minutes: 60
    # Forgejo mints an OIDC ID token only when this is set on the job.
    enable-openid-connect: true
    env:
      S3_BUCKET: tempo-statusbar-releases
      S3_REGION: us-east-1
      DOWNLOAD_BASE: https://tempo-statusbar-releases.s3.us-east-1.amazonaws.com

    steps:
    - name: Verify release for tag
      # Only a run on `main` can assume ci-tempo-statusbar-release, and only
      # for a published (non-draft) v* release whose name equals its tag.
      # /usr/bin/curl and the Xcode CLT python3 — no jq on the Macs.
      if: inputs.tag != ''
      env:
        FORGEJO_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        RUN_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [ "$RUN_REF" != "refs/heads/main" ]; then
          echo "❌ A release build must be dispatched on main (got '$RUN_REF')."
          exit 1
        fi
        if ! [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
          echo "❌ Tag '$RELEASE_TAG' is not a v* release tag."
          exit 1
        fi
        ENC_TAG=$(/usr/bin/python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))')
        if ! /usr/bin/curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
            "$API_URL/repos/$REPO/releases/tags/$ENC_TAG" > release.json; then
          echo "❌ No release found for tag '$RELEASE_TAG'."
          rm -f release.json
          exit 1
        fi
        if [ "$(/usr/bin/python3 -c 'import json; print(bool(json.load(open("release.json")).get("draft")))')" != "False" ]; then
          echo "❌ Release '$RELEASE_TAG' is a draft; publish it first."
          rm -f release.json
          exit 1
        fi
        RELEASE_NAME=$(/usr/bin/python3 -c 'import json; print(json.load(open("release.json")).get("name") or "")')
        rm -f release.json
        if [ -z "$RELEASE_NAME" ]; then
          echo "❌ Release name is empty. Set the release title to match the tag (e.g. '$RELEASE_TAG')."
          exit 1
        fi
        if [ "$RELEASE_TAG" != "$RELEASE_NAME" ]; then
          echo "❌ Release name '$RELEASE_NAME' does not match tag '$RELEASE_TAG'."
          echo ""
          echo "This usually means an RC release was created with the title 'v1.2.3-RC1'"
          echo "but the tag was left at 'v1.2.3', producing an orphaned tag at the stable"
          echo "version. Either:"
          echo "  - delete this release and its tag '$RELEASE_TAG' in Forgejo (Releases → Delete, then Tags → Delete)"
          echo "    and recreate it with matching name and tag, OR"
          echo "  - edit the release to make name and tag identical."
          exit 1
        fi
        echo "✅ Release '$RELEASE_TAG' is published and its name matches the tag"

    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Build the release tag; the workflow file itself still comes from
        # `main`. Empty (manual build test) means the dispatched ref.
        ref: ${{ inputs.tag }}

    - name: Prevent idle sleep
      # macOS idle sleep tracks user input, not CPU load, so a busy job can't
      # keep a shared Mac awake by itself (bonkus#1550). keep-awake (nixos-config
      # home/mac, installed into ~/bin, which is not on the runner service's
      # PATH) holds a caffeinate assertion bounded to timeout-minutes plus
      # margin; the always() step at the end releases it. Warn-only so a Mac
      # without it installed doesn't fail the job. See nixos-config
      # docs/macos-runners.md, "Power / keep-awake".
      run: |
        "$HOME/bin/keep-awake" on 70 \
          || echo "::warning::keep-awake unavailable on $(hostname) — run home-manager switch on this Mac (nixos-config)"

    - name: Select Xcode
      # Shared convention for the two self-hosted Macs (used identically by
      # TempoStatusBar, namey and bonkus): resolve the newest Xcode installed on
      # whichever runner picked up the job and export a job-scoped DEVELOPER_DIR.
      # Never use setup-xcode or xcode-select here — those change the *machine's*
      # active Xcode (via sudo) for every other repo sharing the runner.
      run: |
        newest=""
        newest_key=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          case "$app" in *[Bb]eta*) continue ;; esac
          ver=$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo 0)
          key=$(echo "$ver" | awk -F. '{printf "%03d%03d%03d", $1, $2, $3}')
          if [ -z "$newest" ] || [ "$key" \> "$newest_key" ]; then
            newest="$app"; newest_key="$key"
          fi
        done
        if [ -z "$newest" ]; then
          echo "::error::No Xcode found under /Applications on runner $(hostname)"
          exit 1
        fi
        echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    - name: Extract version from tag
      id: version
      env:
        # The dispatched release tag; a manual build test without `tag`
        # falls back to the dispatched ref's name.
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        # Extract version from the release tag (remove 'v' prefix if present)
        VERSION=${RELEASE_TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Import signing certificate
      env:
        SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/signing.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

        echo "$SIGNING_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import the signing identity (cert + private key). Omit -t so pkcs12
        # aggregate items (cert and key) are both imported.
        security import "$CERT_PATH" -P "$SIGNING_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"

        # Import the full Apple chain the leaf Developer ID cert may need: both
        # "Developer ID Certification Authority" intermediates (G1 and G2 — the
        # .p12 holds only the leaf + key, which may be issued by either) and both
        # Apple roots (classic and G2 — the G2 intermediate chains to the G2
        # root). GitHub-hosted images preinstall these in the system
        # keychain; the shared self-hosted Macs do not, and codesign fails with
        # "unable to build chain to self-signed root" / errSecInternalComponent
        # when any link is missing (#133).
        for CERT_URL in \
          https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
          https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
          https://www.apple.com/appleca/AppleIncRootCertificate.cer \
          https://www.apple.com/certificateauthority/AppleRootCA-G2.cer; do
          CHAIN_CER="$RUNNER_TEMP/$(basename "$CERT_URL")"
          curl -fsSL -o "$CHAIN_CER" "$CERT_URL"
          # `|| true`: re-importing an already-present cert exits non-zero, which
          # would abort this `bash -e` step; the cert being present is fine.
          security import "$CHAIN_CER" -t cert -k "$KEYCHAIN_PATH" || true
          rm -f "$CHAIN_CER"
        done

        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

        # Prepend the temp keychain to the user's search list so Xcode/codesign
        # can find the identity. The login keychain stays searchable and stays
        # the default so GUI-session processes (e.g. assistantd) are
        # unaffected — this runner runs as the logged-in GUI user, and
        # replacing the search list/default previously made background daemons
        # in that session pick up the temp keychain and prompt for its
        # password (#234).
        EXISTING_KEYCHAINS=()
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          # An orphaned entry from an earlier run that never cleaned up.
          [ "$(basename "$entry")" = "build.keychain-db" ] && continue
          EXISTING_KEYCHAINS+=("$entry")
        done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
        if [ "${#EXISTING_KEYCHAINS[@]}" -eq 0 ]; then
          EXISTING_KEYCHAINS=("login.keychain-db")
        fi
        security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

        rm "$CERT_PATH"

        # Verify the identity is available for codesigning (no -v: self-signed certs
        # aren't "trusted" by the system, but codesign can still use them for signing)
        security find-identity -p codesigning "$KEYCHAIN_PATH"

    - name: Build release version
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          MARKETING_VERSION="${{ steps.version.outputs.version }}" \
          build

    - name: Archive app
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          MARKETING_VERSION="${{ steps.version.outputs.version }}" \
          archive \
          -archivePath ./build/TempoStatusBarApp.xcarchive

    - name: Verify code signature
      run: |
        APP_PATH="./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app"

        echo "=== codesign --display --verbose=4 ==="
        codesign --display --verbose=4 "$APP_PATH"

        echo "=== Designated requirement ==="
        codesign --display --requirements - "$APP_PATH"

        echo "=== codesign --verify --deep --strict ==="
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"

        # Capture once: piping codesign into `grep -q` under pipefail fails with SIGPIPE (exit 141).
        SIG_INFO=$(codesign --display --verbose=2 "$APP_PATH" 2>&1)

        echo "=== Identity must be a Developer ID Application cert ==="
        grep -q 'Authority=Developer ID Application:' <<<"$SIG_INFO" \
          || { echo "❌ Expected Authority=Developer ID Application: not found"; exit 1; }

        echo "=== Hardened Runtime must be enabled ==="
        grep -q 'flags=.*runtime' <<<"$SIG_INFO" \
          || { echo "❌ Hardened Runtime flag not present in signature"; exit 1; }

        echo "✅ Code signature verified"

    - name: Create DMG
      run: |
        set -euo pipefail
        DMG_NAME="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"

        # Fresh staging directory each run.
        rm -rf ./dmg
        mkdir -p ./dmg
        cp -R ./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app ./dmg/

        hdiutil create -volname "TempoStatusBarApp" -srcfolder ./dmg -ov -format UDZO "$DMG_NAME"

        echo "Created $DMG_NAME"

    - name: Sign DMG
      run: |
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"

        # Find the Developer ID Application identity in the temp keychain
        IDENTITY=$(security find-identity -p codesigning "$RUNNER_TEMP/build.keychain-db" \
          | grep 'Developer ID Application' \
          | head -1 \
          | awk -F'"' '{print $2}')

        if [ -z "$IDENTITY" ]; then
          echo "❌ Could not locate Developer ID Application identity for DMG signing"
          exit 1
        fi

        echo "Signing DMG with: $IDENTITY"
        codesign --sign "$IDENTITY" --timestamp "$DMG"
        codesign --verify --verbose=2 "$DMG"

    - name: Notarize DMG
      env:
        AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      run: |
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

        echo "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"

        # Submit and wait. notarytool exits non-zero if submission upload fails,
        # but exits 0 even when the notarization status is "Invalid" — we re-check
        # below by stapling, which only succeeds for accepted submissions.
        xcrun notarytool submit "$DMG" \
          --key "$KEY_PATH" \
          --key-id "$AC_API_KEY_ID" \
          --issuer "$AC_API_ISSUER_ID" \
          --wait \
          --timeout 30m

        rm "$KEY_PATH"

    - name: Staple notarization ticket
      run: |
        set -euo pipefail
        retry() {
          local delays=(15 30 60) attempt=1 rc
          while true; do
            "$@" && return 0
            rc=$?
            if [ "$attempt" -gt "${#delays[@]}" ]; then
              echo "::error::$* failed after $attempt attempts (exit $rc)"
              return "$rc"
            fi
            echo "::warning::$* failed (exit $rc), attempt $attempt; retrying in ${delays[$((attempt-1))]}s"
            sleep "${delays[$((attempt-1))]}"
            attempt=$((attempt+1))
          done
        }
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        retry xcrun stapler staple "$DMG"
        retry xcrun stapler validate "$DMG"

        # Final Gatekeeper assessment as an end-user would experience it
        spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

    - name: Configure AWS credentials
      if: inputs.tag != ''
      uses: https://github.com/aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
      with:
        # PutObject on releases/* only; trusts this repo's `main` only
        # (aws-account tier1/tempo-statusbar.tf).
        role-to-assume: arn:aws:iam::762672791738:role/ci-tempo-statusbar-release
        aws-region: ${{ env.S3_REGION }}

    - name: Upload DMG to S3
      if: inputs.tag != ''
      run: |
        set -euo pipefail
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        NIX_FLAGS="--extra-experimental-features nix-command --extra-experimental-features flakes"
        nix $NIX_FLAGS shell "$GITHUB_WORKSPACE#macos-tools" --command \
          aws s3 cp "$DMG" "s3://$S3_BUCKET/releases/$DMG" \
          --content-type application/x-apple-diskimage
        nix $NIX_FLAGS shell "$GITHUB_WORKSPACE#macos-tools" --command \
          aws s3 cp "$DMG" "s3://$S3_BUCKET/releases/TempoStatusBarApp-latest.dmg" \
          --content-type application/x-apple-diskimage
        echo "Uploaded to $DOWNLOAD_BASE/releases/$DMG"

    - name: Add download link to release notes
      # On Forgejo this token-driven edit does fire a `release: edited`
      # event; the workflow listens to `published` only, so it does not
      # re-trigger. python3 is the Xcode CLT one — no nix/jq on the Macs.
      # The release is re-read by tag: `github.event.release` is null on the
      # dispatched run.
      if: inputs.tag != ''
      env:
        FORGEJO_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        DMG="TempoStatusBarApp-$VERSION.dmg"
        export DMG URL="$DOWNLOAD_BASE/releases/$DMG"
        ENC_TAG=$(/usr/bin/python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))')
        /usr/bin/curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
          "$API_URL/repos/$REPO/releases/tags/$ENC_TAG" > release.json
        RELEASE_ID=$(/usr/bin/python3 -c 'import json; print(json.load(open("release.json"))["id"])')
        /usr/bin/python3 -c 'import json, os; body = json.load(open("release.json")).get("body") or ""; print(json.dumps({"body": "%s\n\n---\n**Download:** [%s](%s)" % (body, os.environ["DMG"], os.environ["URL"])}))' > release-body.json
        rm -f release.json
        /usr/bin/curl -fsS -X PATCH \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H 'Content-Type: application/json' \
          --data @release-body.json \
          "$API_URL/repos/$REPO/releases/$RELEASE_ID" > /dev/null
        rm -f release-body.json

    - name: Clean up signing keychain
      if: always()
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

        # Rebuild the search list without any build.keychain-db entries (ours,
        # or an orphan left by a run that didn't get this far).
        REMAINING_KEYCHAINS=()
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          [ "$(basename "$entry")" = "build.keychain-db" ] && continue
          REMAINING_KEYCHAINS+=("$entry")
        done < <(security list-keychains -d user 2>/dev/null | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
        if [ "${#REMAINING_KEYCHAINS[@]}" -eq 0 ]; then
          REMAINING_KEYCHAINS=("login.keychain-db")
        fi
        security list-keychains -d user -s "${REMAINING_KEYCHAINS[@]}" 2>/dev/null || true

        # Only self-heal the default keychain if it was left pointing at a
        # build keychain (left over from a run that predates #234); never
        # touch it otherwise, since we no longer change it ourselves.
        DEFAULT_KC=$(security default-keychain -d user 2>/dev/null || true)
        if grep -q 'build.keychain-db' <<< "$DEFAULT_KC"; then
          security default-keychain -d user -s login.keychain-db 2>/dev/null || true
        fi

        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/AuthKey.p8"

    - name: Release idle-sleep assertion
      if: always()
      run: |
        "$HOME/bin/keep-awake" off || true

  security-check:
    name: Security Check
    runs-on: [container, linux]
    # See the guard on dispatch-release-build: `linux-v*` releases are the Linux app's
    # own line and are verified by linux-release.yml.
    if: ${{ !startsWith(github.event.release.tag_name, 'linux-v') }}

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    - name: Trivy scan
      uses: ./.github/actions/trivy-scan

  documentation-check:
    name: Documentation Check
    runs-on: [container, linux]
    # See the guard on dispatch-release-build.
    if: ${{ !startsWith(github.event.release.tag_name, 'linux-v') }}

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        
    - name: Check for documentation
