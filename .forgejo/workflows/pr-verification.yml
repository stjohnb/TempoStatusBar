name: PR Verification

on:
  pull_request:
    branches: [ main ]
    # paths-ignore only skips when *every* changed file matches, so a mixed
    # Swift + Rust PR still runs the macOS jobs.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # The Linux tray app is built by linux-ci.yml; keep it off the shared Macs.
      - 'linux/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: [self-hosted, macos, tempo]
    # Only two Macs serve three repos — a wedged job must not hold one for hours.
    timeout-minutes: 60
    # Forgejo mints an OIDC ID token only when this is set on the job (or
    # workflow); without it configure-aws-credentials finds no token. The
    # issuer is https://www.bstjohn.net/forgejo-oidc (see s3-bootstrap.yml).
    enable-openid-connect: true
    # contents dropped to read when DMG publishing moved from per-PR
    # pre-releases to S3 (#177); id-token: write is required for OIDC.
    # issues: write as well as pull-requests: write because Forgejo's PR
    # comment endpoint is /issues/{index}/comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      S3_BUCKET: tempo-statusbar-releases
      S3_REGION: us-east-1
      DOWNLOAD_BASE: https://tempo-statusbar-releases.s3.us-east-1.amazonaws.com

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Expose Homebrew
      # The Forgejo host runner's PATH omits Homebrew, so `aws` (and in
      # code-quality, `swiftlint`) would not be found without this.
      run: |
        for d in /opt/homebrew/bin /usr/local/bin; do if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi; done

    - name: Prevent idle sleep
      # macOS idle sleep tracks user input, not CPU load, so a busy job can't
      # keep a shared Mac awake by itself (bonkus#1550). keep-awake (nixos-config
      # home/mac, installed into ~/bin, which is not on the runner service's
      # PATH) holds a caffeinate assertion bounded to timeout-minutes plus
      # margin; the always() step at the end releases it. Warn-only so a Mac
      # without it installed doesn't fail the job. See nixos-config
      # docs/macos-runners.md, "Power / keep-awake".
      run: |
        "$HOME/bin/keep-awake" on 70 \
          || echo "::warning::keep-awake unavailable on $(hostname) — run home-manager switch on this Mac (nixos-config)"

    - name: Select Xcode
      # Shared convention for the two self-hosted Macs (used identically by
      # TempoStatusBar, namey and bonkus): resolve the newest Xcode installed on
      # whichever runner picked up the job and export a job-scoped DEVELOPER_DIR.
      # Never use setup-xcode or xcode-select here — those change the *machine's*
      # active Xcode (via sudo) for every other repo sharing the runner.
      run: |
        newest=""
        newest_key=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          case "$app" in *[Bb]eta*) continue ;; esac
          ver=$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo 0)
          key=$(echo "$ver" | awk -F. '{printf "%03d%03d%03d", $1, $2, $3}')
          if [ -z "$newest" ] || [ "$key" \> "$newest_key" ]; then
            newest="$app"; newest_key="$key"
          fi
        done
        if [ -z "$newest" ]; then
          echo "::error::No Xcode found under /Applications on runner $(hostname)"
          exit 1
        fi
        echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

    - name: Generate version from PR and SHA
      id: version
      run: |
        git fetch --tags
        LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
        if [ -z "$LATEST_TAG" ]; then LATEST_TAG="0.0.0"; fi
        VERSION="${LATEST_TAG}-pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Import signing certificate
      env:
        SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/signing.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

        echo "$SIGNING_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import the signing identity (cert + private key). Omit -t so pkcs12
        # aggregate items (cert and key) are both imported.
        security import "$CERT_PATH" -P "$SIGNING_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"

        # Import the full Apple chain the leaf Developer ID cert may need: both
        # "Developer ID Certification Authority" intermediates (G1 and G2 — the
        # .p12 holds only the leaf + key, which may be issued by either) and both
        # Apple roots (classic and G2 — the G2 intermediate chains to the G2
        # root). GitHub-hosted images preinstall these in the system
        # keychain; the shared self-hosted Macs do not, and codesign fails with
        # "unable to build chain to self-signed root" / errSecInternalComponent
        # when any link is missing (#133).
        for CERT_URL in \
          https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
          https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
          https://www.apple.com/appleca/AppleIncRootCertificate.cer \
          https://www.apple.com/certificateauthority/AppleRootCA-G2.cer; do
          CHAIN_CER="$RUNNER_TEMP/$(basename "$CERT_URL")"
          curl -fsSL -o "$CHAIN_CER" "$CERT_URL"
          # `|| true`: re-importing an already-present cert exits non-zero, which
          # would abort this `bash -e` step; the cert being present is fine.
          security import "$CHAIN_CER" -t cert -k "$KEYCHAIN_PATH" || true
          rm -f "$CHAIN_CER"
        done

        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

        # Prepend the temp keychain to the user's search list so Xcode/codesign
        # can find the identity. The login keychain stays searchable and stays
        # the default so GUI-session processes (e.g. assistantd) are
        # unaffected — this runner runs as the logged-in GUI user, and
        # replacing the search list/default previously made background daemons
        # in that session pick up the temp keychain and prompt for its
        # password (#234).
        EXISTING_KEYCHAINS=()
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          # An orphaned entry from an earlier run that never cleaned up.
          [ "$(basename "$entry")" = "build.keychain-db" ] && continue
          EXISTING_KEYCHAINS+=("$entry")
        done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
        if [ "${#EXISTING_KEYCHAINS[@]}" -eq 0 ]; then
          EXISTING_KEYCHAINS=("login.keychain-db")
        fi
        security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

        # Confirms the prepend left the login keychain searchable and default
        # (guards against #234 recurring): expect build.keychain-db first,
        # login.keychain-db still present, and the default unchanged.
        echo "=== Keychain search list after import ==="
        security list-keychains -d user
        echo "=== Default keychain after import ==="
        security default-keychain -d user

        rm "$CERT_PATH"

        # Verify the identity is available for codesigning (no -v: self-signed certs
        # aren't "trusted" by the system, but codesign can still use them for signing)
        security find-identity -p codesigning "$KEYCHAIN_PATH"

        # Diagnostics for chain-building failures on the self-hosted Macs: show
        # the leaf's issuer and let the trust evaluator name the failing link.
        # Non-fatal — the build step below is the real gate.
        LEAF_PEM="$RUNNER_TEMP/leaf.pem"
        security find-certificate -c "Developer ID Application" -p "$KEYCHAIN_PATH" > "$LEAF_PEM" || true
        openssl x509 -in "$LEAF_PEM" -noout -subject -issuer -dates || true
        security verify-cert -c "$LEAF_PEM" -p codeSign || echo "verify-cert failed (see above for the failing link)"
        rm -f "$LEAF_PEM"

    - name: Build project
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Debug \
          -destination 'platform=macOS' \
          build

    - name: Build for release
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          MARKETING_VERSION="${{ steps.version.outputs.version }}" \
          build

    - name: Run unit tests
      env:
        # Skip the real-keychain CredentialManager tests: on the shared
        # self-hosted Macs the runner user's login keychain holds genuine
        # credentials under the production service name, and headless keychain
        # access blocks on authorization dialogs (see PR #165). xcodebuild only
        # forwards env vars prefixed TEST_RUNNER_ into the test-host process
        # (prefix stripped), so the tests see TEMPO_SKIP_KEYCHAIN_TESTS=1.
        TEST_RUNNER_TEMPO_SKIP_KEYCHAIN_TESTS: "1"
      run: |
        echo "🧪 Running unit tests using local test script..."
        chmod +x ./run_tests.sh
        ./run_tests.sh
        
        echo "✅ Unit tests completed successfully"

    - name: Upload test results
      uses: https://code.forgejo.org/forgejo/upload-artifact@v4
      if: always()
      # Best-effort: org Actions storage quota exhaustion must not fail the
      # build (#177 — observed as "Artifact storage quota has been hit").
      continue-on-error: true
      with:
        name: test-results
        path: test-results.xcresult
        retention-days: 3

    - name: Test summary
      if: always()
      run: |
        echo "📊 Test Summary:"
        echo "=================="
        if [ -d "test-results.xcresult" ]; then
          echo "✅ Test results generated successfully"
          echo "📁 Test results saved as artifact: test-results"
          echo "🔍 View test results in the Actions tab"
        else
          echo "⚠️  No test results found"
        fi

    - name: Build and archive
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        echo "Running integration tests..."
        # Check if the app can be built and archived.
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          MARKETING_VERSION="${{ steps.version.outputs.version }}" \
          archive \
          -archivePath ./build/TempoStatusBarApp.xcarchive
          
        echo "✅ App can be successfully archived"
        
    - name: Check app bundle structure
      run: |
        echo "Checking app bundle structure..."
        if [ -d "./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app" ]; then
          echo "✅ App bundle structure is correct"
        else
          echo "❌ App bundle structure is incorrect"
          exit 1
        fi

    - name: Verify code signature
      run: |
        APP_PATH="./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app"

        echo "=== codesign --display --verbose=4 ==="
        codesign --display --verbose=4 "$APP_PATH"

        echo "=== Designated requirement ==="
        codesign --display --requirements - "$APP_PATH"

        echo "=== codesign --verify --deep --strict ==="
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"

        # Capture once: piping codesign into `grep -q` under pipefail fails with SIGPIPE (exit 141).
        SIG_INFO=$(codesign --display --verbose=2 "$APP_PATH" 2>&1)

        echo "=== Identity must be a Developer ID Application cert ==="
        grep -q 'Authority=Developer ID Application:' <<<"$SIG_INFO" \
          || { echo "❌ Expected Authority=Developer ID Application: not found"; exit 1; }

        echo "=== Hardened Runtime must be enabled ==="
        grep -q 'flags=.*runtime' <<<"$SIG_INFO" \
          || { echo "❌ Hardened Runtime flag not present in signature"; exit 1; }

        echo "✅ Code signature verified"

    - name: Create DMG
      run: |
        set -euo pipefail
        DMG_NAME="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"

        # Fresh staging directory each run.
        rm -rf ./dmg
        mkdir -p ./dmg
        cp -R ./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app ./dmg/

        hdiutil create -volname "TempoStatusBarApp" -srcfolder ./dmg -ov -format UDZO "$DMG_NAME"

        echo "Created $DMG_NAME"

    - name: Sign DMG
      # Same-repo guard: Forgejo fork PRs get no secrets or OIDC token.
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: |
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"

        # Find the Developer ID Application identity in the temp keychain
        IDENTITY=$(security find-identity -p codesigning "$RUNNER_TEMP/build.keychain-db" \
          | grep 'Developer ID Application' \
          | head -1 \
          | awk -F'"' '{print $2}')

        if [ -z "$IDENTITY" ]; then
          echo "❌ Could not locate Developer ID Application identity for DMG signing"
          exit 1
        fi

        echo "Signing DMG with: $IDENTITY"
        codesign --sign "$IDENTITY" --timestamp "$DMG"
        codesign --verify --verbose=2 "$DMG"

    - name: Notarize DMG
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      run: |
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

        echo "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"

        # Submit and wait. notarytool exits non-zero if submission upload fails,
        # but exits 0 even when the notarization status is "Invalid" — we re-check
        # below by stapling, which only succeeds for accepted submissions.
        xcrun notarytool submit "$DMG" \
          --key "$KEY_PATH" \
          --key-id "$AC_API_KEY_ID" \
          --issuer "$AC_API_ISSUER_ID" \
          --wait \
          --timeout 30m

        rm "$KEY_PATH"

    - name: Staple notarization ticket
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: |
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        xcrun stapler staple "$DMG"
        xcrun stapler validate "$DMG"

        # Final Gatekeeper assessment as an end-user would experience it
        spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

    - name: Ensure AWS CLI
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      run: |
        # Self-hosted runners keep the CLI installed between runs; a bare
        # `brew install` would try to upgrade an existing copy (see the
        # SwiftLint pattern below).
        command -v aws >/dev/null 2>&1 || brew install awscli

    - name: Configure AWS credentials
      # Fork PRs have no OIDC access to the role — same guard as sign/notarize.
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: https://github.com/aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.S3_REGION }}

    - name: Upload DMG to S3
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      run: |
        set -euo pipefail
        DMG="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"
        aws s3 cp "$DMG" "s3://$S3_BUCKET/pr/${{ github.event.pull_request.number }}/$DMG" \
          --content-type application/x-apple-diskimage

    - name: Comment PR with build artifact link
      # Mac jobs don't use the flake (it targets Linux only), so there is no
      # jq here; the Xcode CLT python3 does the JSON and HTTP. Matches on the
      # marker rather than the author, because Forgejo's API user object has
      # no `type: "Bot"` field.
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      timeout-minutes: 2
      env:
        FORGEJO_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        /usr/bin/python3 - <<'PY'
        import json, os, urllib.request

        api, repo, pr = os.environ["API_URL"], os.environ["REPO"], os.environ["PR"]
        version = os.environ["VERSION"]
        dmg_name = f"TempoStatusBarApp-{version}.dmg"
        download_url = f"{os.environ['DOWNLOAD_BASE']}/pr/{pr}/{dmg_name}"
        marker = "<!-- pr-build-comment -->"

        body = "\n".join([
            marker,
            "## PR Build Available",
            "",
            "A signed and notarized macOS DMG for this PR is hosted on S3.",
            "",
            "| | |",
            "|---|---|",
            f"| **Version** | `{version}` |",
            f"| **Download** | [{dmg_name}]({download_url}) |",
            "",
            "**To install:**",
            "1. Click the download link above (the `.dmg` is served raw — not wrapped in a zip)",
            "2. Open the `.dmg`, drag **TempoStatusBarApp** to Applications",
            "",
            "> A new build is uploaded on every push; all builds for this PR are deleted from S3 when the PR closes.",
        ])

        def call(method, path, payload=None):
            data = json.dumps(payload).encode() if payload is not None else None
            req = urllib.request.Request(f"{api}{path}", data=data, method=method)
            req.add_header("Authorization", f"token {os.environ['FORGEJO_TOKEN']}")
            req.add_header("Content-Type", "application/json")
            with urllib.request.urlopen(req, timeout=30) as resp:
                return json.load(resp)

        # Forgejo's issue-comments endpoint ignores page/limit and always
        # returns every comment, so fetch once — paging would loop forever.
        comments = call("GET", f"/repos/{repo}/issues/{pr}/comments")
        existing = next((c for c in comments if marker in (c.get("body") or "")), None)
        if existing:
            call("PATCH", f"/repos/{repo}/issues/comments/{existing['id']}", {"body": body})
        else:
            call("POST", f"/repos/{repo}/issues/{pr}/comments", {"body": body})
        PY

    - name: Clean up signing keychain
      if: always()
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

        # Rebuild the search list without any build.keychain-db entries (ours,
        # or an orphan left by a run that didn't get this far).
        REMAINING_KEYCHAINS=()
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          [ "$(basename "$entry")" = "build.keychain-db" ] && continue
          REMAINING_KEYCHAINS+=("$entry")
        done < <(security list-keychains -d user 2>/dev/null | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
        if [ "${#REMAINING_KEYCHAINS[@]}" -eq 0 ]; then
          REMAINING_KEYCHAINS=("login.keychain-db")
        fi
        security list-keychains -d user -s "${REMAINING_KEYCHAINS[@]}" 2>/dev/null || true

        # Only self-heal the default keychain if it was left pointing at a
        # build keychain (left over from a run that predates #234); never
        # touch it otherwise, since we no longer change it ourselves.
        DEFAULT_KC=$(security default-keychain -d user 2>/dev/null || true)
        if grep -q 'build.keychain-db' <<< "$DEFAULT_KC"; then
          security default-keychain -d user -s login.keychain-db 2>/dev/null || true
        fi

        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/AuthKey.p8"

        echo "=== Keychain search list after cleanup ==="
        security list-keychains -d user || true
        echo "=== Default keychain after cleanup ==="
        security default-keychain -d user || true

    - name: Release idle-sleep assertion
      if: always()
      run: |
        "$HOME/bin/keep-awake" off || true

  code-quality:
    name: Code Quality
    runs-on: [self-hosted, macos, tempo]
    # Only two Macs serve three repos — a wedged job must not hold one for hours.
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Prevent idle sleep
      # macOS idle sleep tracks user input, not CPU load, so a busy job can't
      # keep a shared Mac awake by itself (bonkus#1550). keep-awake (nixos-config
      # home/mac, installed into ~/bin, which is not on the runner service's
      # PATH) holds a caffeinate assertion bounded to timeout-minutes plus
      # margin; the always() step at the end releases it. Warn-only so a Mac
      # without it installed doesn't fail the job. See nixos-config
      # docs/macos-runners.md, "Power / keep-awake".
      run: |
        "$HOME/bin/keep-awake" on 25 \
          || echo "::warning::keep-awake unavailable on $(hostname) — run home-manager switch on this Mac (nixos-config)"

    - name: Select Xcode
      # Shared convention for the two self-hosted Macs (used identically by
      # TempoStatusBar, namey and bonkus): resolve the newest Xcode installed on
      # whichever runner picked up the job and export a job-scoped DEVELOPER_DIR.
      # Never use setup-xcode or xcode-select here — those change the *machine's*
      # active Xcode (via sudo) for every other repo sharing the runner.
      run: |
        newest=""
        newest_key=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          case "$app" in *[Bb]eta*) continue ;; esac
          ver=$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo 0)
          key=$(echo "$ver" | awk -F. '{printf "%03d%03d%03d", $1, $2, $3}')
          if [ -z "$newest" ] || [ "$key" \> "$newest_key" ]; then
            newest="$app"; newest_key="$key"
          fi
        done
        if [ -z "$newest" ]; then
          echo "::error::No Xcode found under /Applications on runner $(hostname)"
          exit 1
        fi
        echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

    - name: Expose Homebrew
      # The Forgejo host runner's PATH omits Homebrew; swiftlint lives there.
      run: |
        for d in /opt/homebrew/bin /usr/local/bin; do if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi; done

    - name: Install SwiftLint
      run: |
        # Self-hosted runners keep SwiftLint installed between runs; only install
        # when missing. A bare `brew install` would try to upgrade an existing
        # copy and fail on runners where the Homebrew prefix isn't user-writable.
        command -v swiftlint || brew install swiftlint

    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging

    - name: Release idle-sleep assertion
      if: always()
      run: |
        "$HOME/bin/keep-awake" off || true

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, linux]
    
    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    - name: Run Trivy vulnerability scanner
      # No code-scanning upload on Forgejo: HIGH+CRITICAL findings are printed
      # as a table for the log, and only CRITICAL findings with a fix
      # available fail the job. If this goes red, fix the dependency rather
      # than loosening the gate.
      run: |
        NIX_FLAGS="--extra-experimental-features nix-command --extra-experimental-features flakes"
        nix $NIX_FLAGS develop "$GITHUB_WORKSPACE#security" --command \
          trivy fs --scanners vuln --severity HIGH,CRITICAL --format table .
        nix $NIX_FLAGS develop "$GITHUB_WORKSPACE#security" --command \
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
