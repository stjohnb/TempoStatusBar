name: Linux Release

on:
  push:
    branches: [ main ]
    paths:
      - 'linux/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.forgejo/workflows/linux-release.yml'
  # Dispatch on main to re-run after a runner outage. If linux-vX.Y.Z already
  # exists, the gate step logs a notice and the run is a green no-op.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

env:
  NIX_FLAGS: --extra-experimental-features nix-command --extra-experimental-features flakes

jobs:
  release:
    name: Build and Publish Static Binary
    runs-on: [self-hosted, linux]
    # The first pkgsStatic build compiles a musl stdenv closure from source.
    timeout-minutes: 90
    env:
      FORGEJO_TOKEN: ${{ github.token }}
      API_URL: ${{ github.api_url }}
      REPO: ${{ github.repository }}
    # Every run step executes inside the `ci` devShell (curl, jq); the runner
    # baseline is nix/git/docker only. Steps that need the Rust toolchain or
    # readelf still call `nix develop .#` themselves.
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#ci --command bash -euo pipefail {0}

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Nix
      uses: ./.github/actions/setup-nix

    - name: Resolve version and decide whether to release
      id: gate
      run: |
        set -euo pipefail
        # Evaluates the attribute only — does not build.
        VERSION=$(nix $NIX_FLAGS eval --raw .#static.version)
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::linux/Cargo.toml version '$VERSION' is not X.Y.Z; pre-release Linux tags are not supported"
          exit 1
        fi
        TAG="linux-v$VERSION"
        DIR="tempo-statusbar-$VERSION-x86_64-linux"
        # Distinguish "tag absent" (HTTP 404) from a broken API call, which must
        # fail loudly rather than be read as "absent" and always release.
        CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: token $FORGEJO_TOKEN" \
          "$API_URL/repos/$REPO/tags/$TAG")
        case "$CODE" in
          200)
            echo "::notice::$TAG already exists — bump version in linux/Cargo.toml to publish"
            echo "release=false" >> "$GITHUB_OUTPUT"
            ;;
          404)
            echo "release=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Forgejo API returned HTTP $CODE while checking for tag $TAG"
            exit 1
            ;;
        esac
        {
          echo "version=$VERSION"
          echo "tag=$TAG"
          echo "dir=$DIR"
        } >> "$GITHUB_OUTPUT"

    - name: Build static binary
      if: steps.gate.outputs.release == 'true'
      run: nix $NIX_FLAGS build .#static

    - name: Verify the artifact
      if: steps.gate.outputs.release == 'true'
      run: |
        set -euo pipefail
        BIN=./result/bin/tempo-statusbar
        # readelf comes from pkgs.binutils in the repo's own devShell.
        if nix $NIX_FLAGS develop .# --command readelf -l "$BIN" | grep -q INTERP; then
          echo "::error::.#static produced a dynamically-linked binary (ELF INTERP segment present)"
          exit 1
        fi
        # Only --version: clap prints and exits 0 without touching D-Bus. Running
        # the binary bare would start the tray and exit non-zero on a CI box with
        # no session bus.
        REPORTED=$("$BIN" --version | awk '{print $2}')
        if [ "$REPORTED" != "${{ steps.gate.outputs.version }}" ]; then
          echo "::error::Binary reports $REPORTED but tag is ${{ steps.gate.outputs.tag }}"
          exit 1
        fi
        echo "✅ static, and reports $REPORTED"

    - name: Stage the tarball
      if: steps.gate.outputs.release == 'true'
      run: |
        set -euo pipefail
        DIR="${{ steps.gate.outputs.dir }}"
        rm -rf dist && mkdir -p "dist/$DIR"
        # -m 0755 is required: the nix store copy is read-only.
        install -m 0755 ./result/bin/tempo-statusbar "dist/$DIR/tempo-statusbar"
        install -m 0644 linux/packaging/tempo-statusbar.desktop "dist/$DIR/"
        install -m 0644 linux/packaging/tempo-statusbar.service "dist/$DIR/"
        install -m 0644 linux/packaging/INSTALL.md "dist/$DIR/"
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -C dist -czf "$DIR.tar.gz" "$DIR"
        sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"

    - name: Write release notes
      if: steps.gate.outputs.release == 'true'
      run: |
        set -euo pipefail
        DIR="${{ steps.gate.outputs.dir }}"
        cat > release-notes.md <<EOF
        Linux tray app, version ${{ steps.gate.outputs.version }}.

        This is the Linux companion to the TempoStatusBar macOS menu bar app —
        a separate Rust implementation speaking the StatusNotifierItem protocol,
        with the same Tempo endpoints, thresholds and colours. It is released on
        its own \`linux-v*\` tag line, independent of the macOS \`v*\` releases.

        ## Download

        Grab both assets below, verify the checksum, then unpack:

        \`\`\`sh
        sha256sum -c $DIR.tar.gz.sha256
        tar xzf $DIR.tar.gz
        \`\`\`

        The binary is **statically linked**: no runtime dependencies, no system
        cert store needed (the Mozilla trust roots are compiled in), and no
        glibc version to match. It runs on any x86_64 Linux distribution.

        ## Install

        \`\`\`sh
        cd $DIR
        install -Dm755 tempo-statusbar ~/.local/bin/tempo-statusbar
        tempo-statusbar set-credentials    # prompts for URL, username and token
        \`\`\`

        For autostart, the tarball ships both a \`.desktop\` entry and a systemd
        user unit — see \`INSTALL.md\` inside it. The systemd unit is
        recommended, because \`Restart=on-failure\` wins the login-time race
        against the panel starting.

        ## GNOME needs an extension

        GNOME Shell shows **no** StatusNotifierItem without
        \`gnome-shell-extension-appindicator\` (the "AppIndicator and
        KStatusNotifierItem Support" extension). Installing the package is not
        enough — the extension must be **enabled**.

        Without it, \`tempo-statusbar\` prints a \`StatusNotifierWatcher\`
        message on stderr and exits non-zero rather than failing silently. This
        is expected SNI behaviour, not an app bug.

        KDE Plasma, Xfce, Cinnamon and wlroots panels (Waybar, i3status-rust)
        support SNI natively and need nothing extra.

        ## Architectures

        x86_64 only — aarch64 and other architectures build from source:

        \`\`\`sh
        nix build github:stjohnb/TempoStatusBar#static
        \`\`\`
        EOF

    - name: Create release
      if: steps.gate.outputs.release == 'true'
      # Created as a draft, assets attached, then published, so `release:
      # published` (fired on Forgejo for token-created releases, unlike GitHub)
      # only happens once the assets exist; release-tag.yml's `linux-v` guard
      # is what keeps it from starting a macOS build.
      run: |
        DIR="${{ steps.gate.outputs.dir }}"
        TAG="${{ steps.gate.outputs.tag }}"
        # Creating the release creates the tag at target_commitish; no separate
        # tag step. Name equals tag deliberately — release-tag.yml enforces
        # name == tag for the macOS line and the convention is worth keeping
        # uniform.
        # A draft has no git tag, so the gate can't see one left behind by a
        # cancelled or timed-out run; delete any such draft so this is idempotent.
        STALE=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
          "$API_URL/repos/$REPO/releases?draft=true&limit=50" \
          | jq -r --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag) | .id')
        for ID in $STALE; do
          curl -fsS -X DELETE -H "Authorization: token $FORGEJO_TOKEN" \
            "$API_URL/repos/$REPO/releases/$ID" > /dev/null
        done
        PAYLOAD=$(jq -Rs --arg tag "$TAG" --arg sha "$GITHUB_SHA" \
          '{tag_name: $tag, target_commitish: $sha, name: $tag, body: ., draft: true}' release-notes.md)
        RELEASE_ID=$(curl -fsS -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H 'Content-Type: application/json' -d "$PAYLOAD" \
          "$API_URL/repos/$REPO/releases" | jq -r '.id')
        # Remove the draft on failure so the gate can retry on the next run.
        trap 'curl -sS -X DELETE -H "Authorization: token $FORGEJO_TOKEN" "$API_URL/repos/$REPO/releases/$RELEASE_ID" > /dev/null || true' ERR
        for FILE in "$DIR.tar.gz" "$DIR.tar.gz.sha256"; do
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -F "attachment=@$FILE" \
            "$API_URL/repos/$REPO/releases/$RELEASE_ID/assets?name=$FILE" > /dev/null
        done
        curl -fsS -X PATCH \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H 'Content-Type: application/json' -d '{"draft": false}' \
          "$API_URL/repos/$REPO/releases/$RELEASE_ID" > /dev/null
        trap - ERR
        echo "Published $TAG with $DIR.tar.gz and its .sha256"
