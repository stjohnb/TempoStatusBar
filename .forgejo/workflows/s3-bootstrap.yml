name: S3 Bootstrap

# One-time (but idempotent, safe to re-run) provisioning of the AWS resources
# that the release/PR workflows need for S3 DMG storage (#177):
#
#   1. S3 bucket with public-read on releases/* and pr/* prefixes
#   2. Forgejo OIDC identity provider (https://www.bstjohn.net/forgejo-oidc)
#      in the AWS account, if missing
#   3. IAM role trust-scoped to this repo on the Forgejo issuer only, with S3
#      access to the bucket only. Re-running rewrites the trust policy, which
#      is how the existing role moved off GitHub's issuer after the Forgejo
#      migration; the role name is unchanged so AWS_ROLE_ARN stays valid.
#
# Bootstrap credentials: create a temporary IAM user access key with rights to
# manage S3/IAM, store it as the Forgejo Actions secrets
# AWS_BOOTSTRAP_ACCESS_KEY_ID and AWS_BOOTSTRAP_SECRET_ACCESS_KEY, run this
# workflow once, then:
#
#   - store the printed role ARN as the AWS_ROLE_ARN Forgejo Actions secret
#   - revoke the temporary access key and delete both bootstrap secrets
#
# Everything after bootstrap authenticates via OIDC (enable-openid-connect +
# id-token: write + aws-actions/configure-aws-credentials assuming
# AWS_ROLE_ARN) — no static AWS credentials remain anywhere.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: S3 bucket to create/configure
        required: true
        default: tempo-statusbar-releases
      region:
        description: AWS region for the bucket
        required: true
        default: us-east-1
      role_name:
        description: IAM role name for Forgejo Actions OIDC (historical name kept so AWS_ROLE_ARN stays valid)
        required: true
        default: tempo-statusbar-github-actions

# contents: read for the checkout that the `ci` devShell needs.
permissions:
  contents: read

concurrency:
  group: s3-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Provision bucket + OIDC role
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ inputs.region }}
      BUCKET: ${{ inputs.bucket }}
      REGION: ${{ inputs.region }}
      ROLE_NAME: ${{ inputs.role_name }}
    # `aws` comes from the repo's `ci` devShell — no installer step.
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#ci --command bash -euo pipefail {0}
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Check bootstrap credentials are configured
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_BOOTSTRAP_ACCESS_KEY_ID / AWS_BOOTSTRAP_SECRET_ACCESS_KEY secrets are not set."
            echo "Create a temporary IAM access key with S3+IAM admin rights and store it in those Forgejo Actions secrets first."
            exit 1
          fi
          aws --version

      - name: Create S3 bucket
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists — skipping creation."
          else
            # us-east-1 rejects an explicit LocationConstraint; every other
            # region requires one.
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration "LocationConstraint=$REGION"
            fi
            echo "Created bucket $BUCKET in $REGION."
          fi

      - name: Configure public read access for release/PR objects
        run: |
          set -euo pipefail
          # Allow a public bucket policy (ACLs stay blocked; access is granted
          # by policy on the two download prefixes only).
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=false,RestrictPublicBuckets=false'

          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "$(cat <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadDownloads",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": [
                  "arn:aws:s3:::$BUCKET/releases/*",
                  "arn:aws:s3:::$BUCKET/pr/*"
                ]
              }
            ]
          }
          EOF
          )"

      - name: Add lifecycle expiry for PR builds
        # pr-cleanup.yml deletes pr/<N>/ when a PR closes; this is a backstop
        # for uploads orphaned by a cleanup run that never fired.
        run: |
          set -euo pipefail
          aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" \
            --lifecycle-configuration "$(cat <<'EOF'
          {
            "Rules": [
              {
                "ID": "expire-pr-builds",
                "Status": "Enabled",
                "Filter": { "Prefix": "pr/" },
                "Expiration": { "Days": 30 }
              }
            ]
          }
          EOF
          )"

      - name: Ensure Forgejo OIDC identity provider
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          PROVIDER_ARN="arn:aws:iam::$ACCOUNT_ID:oidc-provider/www.bstjohn.net/forgejo-oidc"
          if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$PROVIDER_ARN" >/dev/null 2>&1; then
            echo "OIDC provider already exists: $PROVIDER_ARN"
          else
            # No thumbprint: AWS validates the issuer's certificate against its
            # own trusted CA list.
            aws iam create-open-id-connect-provider \
              --url "https://www.bstjohn.net/forgejo-oidc" \
              --client-id-list "sts.amazonaws.com"
            echo "Created OIDC provider: $PROVIDER_ARN"
          fi
          echo "PROVIDER_ARN=$PROVIDER_ARN" >> "$GITHUB_ENV"

      - name: Create/update IAM role for this repo
        run: |
          set -euo pipefail
          # Trusts the Forgejo issuer only; the GitHub issuer is deliberately
          # dropped now that the GitHub repo is archived.
          TRUST_POLICY=$(cat <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "$PROVIDER_ARN" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "www.bstjohn.net/forgejo-oidc:aud": "sts.amazonaws.com"
                  },
                  "StringLike": {
                    "www.bstjohn.net/forgejo-oidc:sub": "repo:St-John-Software/TempoStatusBar:*"
                  }
                }
              }
            ]
          }
          EOF
          )
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Role $ROLE_NAME already exists — refreshing trust policy."
            aws iam update-assume-role-policy --role-name "$ROLE_NAME" \
              --policy-document "$TRUST_POLICY"
          else
            aws iam create-role --role-name "$ROLE_NAME" \
              --description "Forgejo Actions OIDC role for ${{ github.repository }} S3 releases (#177)" \
              --max-session-duration 3600 \
              --assume-role-policy-document "$TRUST_POLICY"
            echo "Created role $ROLE_NAME."
          fi

          aws iam put-role-policy --role-name "$ROLE_NAME" \
            --policy-name "s3-$BUCKET" \
            --policy-document "$(cat <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:PutObject", "s3:GetObject", "s3:DeleteObject"],
                "Resource": "arn:aws:s3:::$BUCKET/*"
              },
              {
                "Effect": "Allow",
                "Action": "s3:ListBucket",
                "Resource": "arn:aws:s3:::$BUCKET"
              }
            ]
          }
          EOF
          )"

      - name: Print next steps
        run: |
          set -euo pipefail
          ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query Role.Arn --output text)
          echo "S3 bootstrap complete"
          echo ""
          echo "  Bucket:        s3://$BUCKET ($REGION)"
          echo "  Download base: https://$BUCKET.s3.$REGION.amazonaws.com"
          echo "  Role ARN:      $ROLE_ARN"
          echo ""
          echo "Finish the switch to OIDC:"
          echo "  1. Store the role ARN as the Forgejo Actions secret AWS_ROLE_ARN (unchanged if the role already existed)."
          echo "  2. Revoke the temporary bootstrap access key in IAM."
          echo "  3. Delete the AWS_BOOTSTRAP_ACCESS_KEY_ID and AWS_BOOTSTRAP_SECRET_ACCESS_KEY Forgejo Actions secrets."
