name: Trivy scan
description: >-
  Download the Trivy vulnerability DB (with mirror fallback and retries) from
  the repo's `security` devShell, then scan the filesystem. HIGH+CRITICAL
  findings are printed; only fixable CRITICAL findings fail the job.
runs:
  using: composite
  steps:
    - name: Download Trivy vulnerability DB
      shell: bash
      # The Forgejo runner exports GITHUB_TOKEN/GITHUB_ACTOR; Trivy's keychain
      # presents them to ghcr.io, which answers "DENIED: denied" and kills the
      # fallback DB download (issue #clw_01M5A80N3B56SC6Q7ATS3MS3SK). Blank both.
      env:
        GITHUB_TOKEN: ""
        GITHUB_ACTOR: ""
      run: |
        set -euo pipefail
        NIX_FLAGS="--extra-experimental-features nix-command --extra-experimental-features flakes"
        DB_REPOS="--db-repository mirror.gcr.io/aquasec/trivy-db:2 --db-repository ghcr.io/aquasecurity/trivy-db:2 --db-repository public.ecr.aws/aquasecurity/trivy-db:2"
        backoff=(20 40 60 90)
        attempt=0
        until nix $NIX_FLAGS develop "$GITHUB_WORKSPACE#security" --command \
            trivy fs --download-db-only --no-progress $DB_REPOS .; do
          if [ "$attempt" -ge "${#backoff[@]}" ]; then
            echo "::error::Trivy vulnerability DB could not be downloaded after $((attempt + 1)) attempts; the scan did NOT run (scan-infrastructure failure, not a vulnerability finding)"
            exit 1
          fi
          echo "::warning::Trivy DB download failed (attempt $((attempt + 1))); retrying in ${backoff[$attempt]}s"
          sleep "${backoff[$attempt]}"
          attempt=$((attempt + 1))
        done
        echo "Trivy vulnerability DB downloaded; running scan"

    - name: Run Trivy vulnerability scanner
      shell: bash
      # No code-scanning upload on Forgejo. If this goes red, fix the
      # dependency rather than loosening the gate.
      env:
        GITHUB_TOKEN: ""
        GITHUB_ACTOR: ""
      run: |
        NIX_FLAGS="--extra-experimental-features nix-command --extra-experimental-features flakes"
        nix $NIX_FLAGS develop "$GITHUB_WORKSPACE#security" --command \
          trivy fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --format table .
        nix $NIX_FLAGS develop "$GITHUB_WORKSPACE#security" --command \
          trivy fs --skip-db-update --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
