name: Notify on main build failure

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  notify:
    runs-on: [self-hosted, linux]
    concurrency:
      group: notify-main-failure
      cancel-in-progress: false
    # Linux CI also runs on pull_request. A fork PR pushed from the fork's own
    # `main` branch reports head_branch == 'main', so the branch guard alone
    # would file a bogus "Build failure: Linux CI" issue — and dedup-by-title
    # would then suppress the alert for a real push-to-main failure. Only
    # push / schedule / workflow_dispatch runs should alert.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 1000 \
            --json title \
            | jq --arg title "Build failure: ${WORKFLOW_NAME}" \
                 '[.[] | select(.title == $title)] | length')

          if [ "$EXISTING" -eq 0 ]; then
            LABEL_ARGS=()
            if gh label list --repo "$REPO" --json name --jq '.[].name' | grep -qx "bug"; then
              LABEL_ARGS=(--label bug)
            fi
            gh issue create \
              --repo "$REPO" \
              --title "Build failure: ${WORKFLOW_NAME}" \
              --body "Workflow **${WORKFLOW_NAME}** failed on \`main\`: ${RUN_URL}" \
              "${LABEL_ARGS[@]}"
          fi
