name: PR Cleanup

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: pr-cleanup-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  delete-pr-builds:
    name: Delete PR Builds from S3
    # Fork PRs never uploaded (no OIDC access), so nothing to clean up.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    env:
      S3_BUCKET: tempo-statusbar-releases
      S3_REGION: us-east-1
    steps:
      - name: Ensure AWS CLI
        run: |
          command -v aws >/dev/null 2>&1 || {
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install
            rm -rf /tmp/awscliv2.zip /tmp/aws
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.S3_REGION }}

      - name: Delete PR builds from S3
        run: |
          aws s3 rm "s3://$S3_BUCKET/pr/${{ github.event.number }}/" --recursive || true
          echo "Cleanup complete (prefix may not have existed; that is OK)."
