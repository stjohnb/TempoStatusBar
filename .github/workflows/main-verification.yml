name: Main Verification

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  security-events: write
  contents: read

concurrency:
  group: main-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-build:
    name: Main Build
    runs-on: [self-hosted, macos, tempo]
    # Only two Macs serve three repos — a wedged job must not hold one for hours.
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prevent idle sleep
      # macOS idle sleep tracks user input, not CPU load, so a busy job can't
      # keep a shared Mac awake by itself (bonkus#1550). keep-awake (dot-files,
      # symlinked into ~/bin, which is not on the runner service's PATH) holds
      # a caffeinate assertion bounded to timeout-minutes plus margin; the
      # always() step at the end releases it. Warn-only so a Mac without
      # dot-files installed doesn't fail the job. See dot-files
      # docs/macos-runners.md, "Power / keep-awake".
      run: |
        "$HOME/bin/keep-awake" on 40 \
          || echo "::warning::keep-awake unavailable on $(hostname) — run dot-files/install.sh on this Mac"

    - name: Select Xcode
      # Shared convention for the two self-hosted Macs (used identically by
      # TempoStatusBar, namey and bonkus): resolve the newest Xcode installed on
      # whichever runner picked up the job and export a job-scoped DEVELOPER_DIR.
      # Never use setup-xcode or xcode-select here — those change the *machine's*
      # active Xcode (via sudo) for every other repo sharing the runner.
      run: |
        newest=""
        newest_key=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          case "$app" in *[Bb]eta*) continue ;; esac
          ver=$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo 0)
          key=$(echo "$ver" | awk -F. '{printf "%03d%03d%03d", $1, $2, $3}')
          if [ -z "$newest" ] || [ "$key" \> "$newest_key" ]; then
            newest="$app"; newest_key="$key"
          fi
        done
        if [ -z "$newest" ]; then
          echo "::error::No Xcode found under /Applications on runner $(hostname)"
          exit 1
        fi
        echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

    - name: Generate version timestamp
      id: version
      run: |
        echo "version=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Import signing certificate
      env:
        SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/signing.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

        echo "$SIGNING_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import the signing identity (cert + private key). Omit -t so pkcs12
        # aggregate items (cert and key) are both imported.
        security import "$CERT_PATH" -P "$SIGNING_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"

        # Import the full Apple chain the leaf Developer ID cert may need: both
        # "Developer ID Certification Authority" intermediates (G1 and G2 — the
        # .p12 holds only the leaf + key, which may be issued by either) and both
        # Apple roots (classic and G2 — the G2 intermediate chains to the G2
        # root). GitHub-hosted images preinstall these in the system
        # keychain; the shared self-hosted Macs do not, and codesign fails with
        # "unable to build chain to self-signed root" / errSecInternalComponent
        # when any link is missing (#133).
        for CERT_URL in \
          https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
          https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
          https://www.apple.com/appleca/AppleIncRootCertificate.cer \
          https://www.apple.com/certificateauthority/AppleRootCA-G2.cer; do
          CHAIN_CER="$RUNNER_TEMP/$(basename "$CERT_URL")"
          curl -fsSL -o "$CHAIN_CER" "$CERT_URL"
          # `|| true`: re-importing an already-present cert exits non-zero, which
          # would abort this `bash -e` step; the cert being present is fine.
          security import "$CHAIN_CER" -t cert -k "$KEYCHAIN_PATH" || true
          rm -f "$CHAIN_CER"
        done

        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

        # Make the temp keychain the ONLY user keychain in the search list for
        # the duration of the job (restored in the always() cleanup step). Two
        # reasons, both from the shared self-hosted Macs being real machines
        # with real login keychains:
        #   1. The unit tests exercise the real Keychain under the production
        #      service name — with the login keychain searchable they collide
        #      with (and could delete) genuine stored credentials, and hang on
        #      headless authorization prompts.
        #   2. codesign builds its chain across every searchable keychain; a
        #      duplicate/differently-trusted copy of the Developer ID certs in
        #      the login keychain can poison chain building ("unable to build
        #      chain to self-signed root").
        security list-keychains -d user -s "$KEYCHAIN_PATH"

        # Also make it the default keychain: on the self-hosted Macs the runner
        # user has no GUI session, and codesign fails with errSecInternalComponent
        # when the signing keychain is only in the search list. Restored to the
        # login keychain in the always() cleanup step.
        security default-keychain -d user -s "$KEYCHAIN_PATH"

        rm "$CERT_PATH"

        # Verify the identity is available for codesigning (no -v: self-signed certs
        # aren't "trusted" by the system, but codesign can still use them for signing)
        security find-identity -p codesigning "$KEYCHAIN_PATH"

    - name: Build main version
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          build

    - name: Run unit tests
      env:
        # Skip the real-keychain CredentialManager tests: on the shared
        # self-hosted Macs the runner user's login keychain holds genuine
        # credentials under the production service name, and headless keychain
        # access blocks on authorization dialogs (see PR #165). xcodebuild only
        # forwards env vars prefixed TEST_RUNNER_ into the test-host process
        # (prefix stripped), so the tests see TEMPO_SKIP_KEYCHAIN_TESTS=1.
        TEST_RUNNER_TEMPO_SKIP_KEYCHAIN_TESTS: "1"
      run: |
        echo "🧪 Running unit tests using local test script..."
        chmod +x ./run_tests.sh
        ./run_tests.sh
        
        echo "✅ Unit tests completed successfully"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      # Best-effort: org Actions storage quota exhaustion must not fail the
      # build (#177 — observed as "Artifact storage quota has been hit").
      continue-on-error: true
      with:
        name: test-results
        path: test-results.xcresult
        retention-days: 3

    - name: Test summary
      if: always()
      run: |
        echo "📊 Test Summary:"
        echo "=================="
        if [ -d "test-results.xcresult" ]; then
          echo "✅ Test results generated successfully"
          echo "📁 Test results saved as artifact: test-results"
          echo "🔍 View test results in the Actions tab"
        else
          echo "⚠️  No test results found"
        fi
          
    - name: Archive app
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        xcodebuild -project TempoStatusBarApp.xcodeproj \
          -scheme TempoStatusBarApp \
          -configuration Release \
          -destination 'platform=macOS' \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          archive \
          -archivePath ./build/TempoStatusBarApp.xcarchive

    - name: Verify code signature
      run: |
        APP_PATH="./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app"

        echo "=== codesign --display --verbose=4 ==="
        codesign --display --verbose=4 "$APP_PATH"

        echo "=== Designated requirement ==="
        codesign --display --requirements - "$APP_PATH"

        echo "=== codesign --verify --deep --strict ==="
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"

        echo "=== Identity must be a Developer ID Application cert ==="
        codesign --display --verbose=2 "$APP_PATH" 2>&1 | grep -q 'Authority=Developer ID Application:' \
          || { echo "❌ Expected Authority=Developer ID Application: not found"; exit 1; }

        echo "=== Hardened Runtime must be enabled ==="
        codesign --display --verbose=2 "$APP_PATH" 2>&1 | grep -q 'flags=.*runtime' \
          || { echo "❌ Hardened Runtime flag not present in signature"; exit 1; }

        echo "✅ Code signature verified (Developer ID + Hardened Runtime; notarization happens on release tags only)"

    - name: Create DMG
      run: |
        set -euo pipefail
        DMG_NAME="TempoStatusBarApp-${{ steps.version.outputs.version }}.dmg"

        # Fresh staging directory each run.
        rm -rf ./dmg
        mkdir -p ./dmg
        cp -R ./build/TempoStatusBarApp.xcarchive/Products/Applications/TempoStatusBarApp.app ./dmg/

        hdiutil create -volname "TempoStatusBarApp" -srcfolder ./dmg -ov -format UDZO "$DMG_NAME"

        echo "Created $DMG_NAME"

    - name: Clean up signing keychain
      if: always()
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
        security list-keychains -d user -s login.keychain-db 2>/dev/null || true
        security default-keychain -d user -s login.keychain-db 2>/dev/null || true
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

    - name: Release idle-sleep assertion
      if: always()
      run: |
        "$HOME/bin/keep-awake" off || true

  security-check:
    name: Security Check
    runs-on: [self-hosted, linux]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        cache: 'false'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  documentation-check:
    name: Documentation Check
    runs-on: [self-hosted, linux]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Check for documentation
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md found"
        else
          echo "⚠️  README.md not found"
        fi
        
        if [ -f "CONTRIBUTING.md" ]; then
          echo "✅ CONTRIBUTING.md found"
        else
          echo "⚠️  CONTRIBUTING.md not found"
        fi 
