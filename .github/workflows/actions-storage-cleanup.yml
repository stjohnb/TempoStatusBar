name: Actions Storage Cleanup

# Purges GitHub Actions caches and old artifacts daily to protect the
# org-shared storage quota. These workflows intentionally do not rely on GHA
# caching (Trivy DB/binary persist on the self-hosted Linux disk — see
# docs/ci-cd.md), so deleting all caches is safe. If a future workflow ever
# legitimately needs cross-run caching, revisit this job.
#
# Artifacts older than 3 days are also purged. Legacy DMG artifacts uploaded
# before DMG distribution moved to per-PR pre-releases carried the 90-day
# default retention and accumulated against the org-shared quota (#146). Both
# PR and main test-results now use 3-day retention, so a 3-day cutoff deletes
# no live debugging artifact early.

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: true

jobs:
  purge-caches:
    name: Purge Actions Caches and Artifacts
    runs-on: [self-hosted, linux]
    # `gh` and `jq` come from this repo's flake — the self-hosted Linux runner
    # baseline is nix/git/docker only (issue #218), so every run step executes
    # inside the flake's `ci` devShell via the job default shell. That needs
    # the repo checked out first, which is why this job now starts with a
    # checkout it didn't previously need.
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#ci --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh cache delete --all` exits non-zero on an empty list, so guard
          # with `|| true` to keep the scheduled run green when there is
          # nothing to purge.
          gh cache delete --all --repo "${{ github.repository }}" || true
          echo "Cache purge complete."

      - name: Delete artifacts older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Purge orphaned/old Actions artifacts to protect the org-shared
          # 2 GB storage quota (issue #146). The current workflows only upload
          # short-retention `test-results`; older artifacts are stragglers
          # (legacy DMG uploads) that GitHub keeps for 90 days by default.
          # 3 days matches the artifact retention for both PR and main test-results.
          set -uo pipefail
          repo="${{ github.repository }}"
          ids=$(gh api --paginate "repos/$repo/actions/artifacts" \
            --jq '.artifacts[]
                  | select(.expired == false)
                  | select((.created_at | fromdateiso8601) < (now - 3*86400))
                  | .id') || ids=""
          if [ -z "$ids" ]; then
            echo "No artifacts older than 3 days to delete."
          else
            for id in $ids; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$repo/actions/artifacts/$id" || true
            done
          fi
          echo "Artifact purge complete."
